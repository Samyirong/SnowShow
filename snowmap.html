<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="探索 Sam 的 36 座滑雪足跡，以互動地圖搜尋日本、加拿大、美國與澳洲的雪場。"
    />
    <meta name="theme-color" content="#173e39" />
    <title>雪場地圖 — SnowShow</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="assets/css/site.css" />
    <script src="assets/js/resorts.js" defer></script>
    <script src="assets/js/site.js" defer></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      defer
    ></script>
    <script src="assets/js/snowmap.js" defer></script>
  </head>
  <body class="map-page">
    <a class="skip-link" href="#main">跳到主要內容</a>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="SnowShow 首頁"
        ><span class="brand-mark" aria-hidden="true">↟</span> SNOWSHOW<span
          class="brand-dot"
          >.</span
        ></a
      >
      <nav class="site-nav" aria-label="主要導覽">
        <a href="index.html">首頁</a
        ><a href="snowmap.html" aria-current="page">雪場地圖</a
        ><a href="resort.html">雪場風景</a><a href="video.html">雪上影像</a
        ><a href="index.html#about">關於我</a>
      </nav>
      <a
        class="header-social"
        href="https://www.instagram.com/yirong310/"
        target="_blank"
        rel="noopener noreferrer"
        >Instagram ↗</a
      >
    </header>
    <main id="main" class="map-main">
      <div class="map-heading">
        <div>
          <p class="eyebrow">A PERSONAL ATLAS / 2008 — 2026</p>
          <h1>每一座山，<br class="mobile-break" />都是一段故事。</h1>
        </div>
        <div class="map-stat">
          <strong data-total-resorts>36</strong
          ><span>座雪場 · <span data-total-countries>4</span> 個國家</span>
        </div>
      </div>
      <div class="map-workspace">
        <aside class="resort-sidebar" aria-label="搜尋與篩選雪場">
          <div class="sidebar-tools">
            <label class="search-label" for="resort-search"
              >尋找雪上的回憶</label
            >
            <div class="search-box">
              <span aria-hidden="true">⌕</span
              ><input
                id="resort-search"
                type="search"
                placeholder="搜尋雪場、國家或年份…"
                autocomplete="off"
              />
            </div>
            <div class="country-filters" role="group" aria-label="依國家篩選">
              <button type="button" data-country="全部" aria-pressed="true">
                全部</button
              ><button type="button" data-country="日本" aria-pressed="false">
                日本</button
              ><button type="button" data-country="加拿大" aria-pressed="false">
                加拿大</button
              ><button type="button" data-country="美國" aria-pressed="false">
                美國</button
              ><button type="button" data-country="澳洲" aria-pressed="false">
                澳洲
              </button>
            </div>
            <div class="list-summary">
              <span id="result-count" role="status">載入雪場清單…</span
              ><span>按名稱定位 ↗</span>
            </div>
          </div>
          <ul class="resort-list" id="resort-list"></ul>
          <p class="no-results" id="no-results" hidden>
            沒有符合的雪場。<br />試試其他名稱或年份，或選擇「全部」。
          </p>
        </aside>
        <section class="map-stage" aria-label="互動雪場地圖">
          <div
            id="map"
            role="region"
            aria-label="日本、加拿大、美國與澳洲的滑雪足跡"
          ></div>
          <button id="reset-map" type="button" class="map-reset">
            ↗ 顯示全部雪場
          </button>
          <div class="map-legend">
            <span class="legend-dot"></span> 滑過的雪場
            <span class="legend-note">點選圖釘查看紀錄</span>
          </div>
          <p id="map-error" class="map-error" hidden>
            地圖暫時無法載入，請檢查網路後重新整理。<br />你仍可從清單查看全部雪場。
          </p>
        </section>
      </div>
      <p class="map-footnote">從一片粉雪，到世界另一頭。慢慢滑，繼續收藏。</p>
      <noscript
        ><p class="noscript-note">
          請啟用 JavaScript 以使用互動地圖與雪場搜尋。
        </p></noscript
      >
    </main>
  </body>
</html>
